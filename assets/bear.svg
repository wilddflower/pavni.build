<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="A little periwinkle bear with a sprout on its head, waving hi">
  <defs>
    <radialGradient id="fur" cx="35%" cy="28%" r="80%">
      <stop offset="0" stop-color="#c9d3ff"/>
      <stop offset=".5" stop-color="#9fb2ff"/>
      <stop offset="1" stop-color="#8196f0"/>
    </radialGradient>
    <radialGradient id="leaf" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#a8dca6"/>
      <stop offset="1" stop-color="#5fae63"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>

  <!-- waving paw -->
  <g id="paw" transform="rotate(14 318 384)">
    <rect x="290" y="236" width="58" height="160" rx="29" fill="url(#fur)"/>
    <ellipse cx="319" cy="262" rx="13" ry="11" fill="#f4a7b9"/>
    <circle cx="304" cy="243" r="5" fill="#f4a7b9"/>
    <circle cx="319" cy="238" r="5.5" fill="#f4a7b9"/>
    <circle cx="334" cy="243" r="5" fill="#f4a7b9"/>
    <ellipse cx="302" cy="290" rx="5" ry="14" fill="#fff" opacity=".35" filter="url(#soft)"/>
  </g>

  <!-- body, cropped at the chest -->
  <ellipse cx="200" cy="420" rx="140" ry="130" fill="url(#fur)"/>
  <ellipse cx="118" cy="344" rx="30" ry="9" fill="#fff" opacity=".3" filter="url(#soft)" transform="rotate(-20 118 344)"/>

  <!-- soft shadow under the chin -->
  <ellipse cx="200" cy="318" rx="96" ry="15" fill="#6d82e4" opacity=".35" filter="url(#soft)"/>

  <!-- ears -->
  <circle cx="118" cy="122" r="40" fill="url(#fur)"/>
  <circle cx="282" cy="122" r="40" fill="url(#fur)"/>
  <circle cx="121" cy="126" r="21" fill="#f4a7b9"/>
  <circle cx="279" cy="126" r="21" fill="#f4a7b9"/>
  <ellipse cx="104" cy="106" rx="9" ry="5" fill="#fff" opacity=".55" transform="rotate(-30 104 106)"/>

  <!-- head: big, round and squishy -->
  <ellipse cx="200" cy="212" rx="120" ry="106" fill="url(#fur)"/>

  <!-- face: tiny features, low and wide -->
  <ellipse cx="142" cy="258" rx="18" ry="10" fill="#f4a7b9" opacity=".75" filter="url(#soft)"/>
  <ellipse cx="258" cy="258" rx="18" ry="10" fill="#f4a7b9" opacity=".75" filter="url(#soft)"/>
  <circle cx="160" cy="238" r="7.5" fill="#1f2d66"/>
  <circle cx="240" cy="238" r="7.5" fill="#1f2d66"/>
  <circle cx="162.5" cy="235.5" r="2.2" fill="#fff"/>
  <circle cx="242.5" cy="235.5" r="2.2" fill="#fff"/>
  <ellipse cx="200" cy="247" rx="6.5" ry="4.5" fill="#1f2d66"/>
  <path d="M193 255q7 6 14 0" fill="none" stroke="#1f2d66" stroke-width="3" stroke-linecap="round"/>

  <!-- gloss, kept soft -->
  <ellipse cx="150" cy="150" rx="42" ry="19" fill="#fff" opacity=".42" filter="url(#soft)" transform="rotate(-25 150 150)"/>
  <ellipse cx="178" cy="132" rx="10" ry="6" fill="#fff" opacity=".85" transform="rotate(-20 178 132)"/>
  <circle cx="197" cy="128" r="3.5" fill="#fff" opacity=".8"/>

  <!-- sprout -->
  <path d="M200 110C200 97 201 86 200 76" fill="none" stroke="#5fae63" stroke-width="5" stroke-linecap="round"/>
  <path d="M199 80C188 62 166 58 152 66C160 82 182 88 199 80Z" fill="url(#leaf)"/>
  <path d="M201 78C210 58 234 52 250 60C244 78 220 86 201 78Z" fill="url(#leaf)"/>
  <ellipse cx="170" cy="68" rx="7" ry="3" fill="#fff" opacity=".55" transform="rotate(10 170 68)"/>
  <ellipse cx="228" cy="62" rx="8" ry="3" fill="#fff" opacity=".55" transform="rotate(-12 228 62)"/>
</svg>
